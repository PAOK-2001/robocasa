[project]
name = "robocasa"
version = "1.0.1"
description = "RoboCasa365: A Large-Scale Simulation Framework for Training and Benchmarking Generalist Robots"
readme = "README.md"
authors = [
    { name = "Soroush Nasiriany" },
    { name = "Sepehr Nasiriany" },
    { name = "Abhiram Maddukuri", email = "abhicm@utexas.edu" },
    { name = "Yuke Zhu" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.5",
    "numba==0.61.2",
    "scipy==1.15.3",
    "mujoco==3.3.1",
    "pygame",
    "Pillow",
    "opencv-python",
    "pyyaml",
    "pynput",
    "tqdm",
    "termcolor",
    "imageio",
    "h5py",
    "lxml",
    "hidapi",
    "tianshou==0.4.10",
    "lerobot==0.3.3",
    "gymnasium",
    "robosuite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Runtime deps of the langskill-tokens policy stack (src/eval_policy_robocasa.py runs in this env with
# PYTHONPATH=<repo>/src, because LIBERO pins robosuite 1.4 / numpy 1.26 in the main env).
[dependency-groups]
langskill = [
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "transformers>=4.52.4",
    "positional-encodings>=6.0.3",
    "vector-quantize-pytorch>=1.22.17",
    "scikit-learn>=1.7.0",
    "hdbscan>=0.8.40",
    "nvidia-ml-py3>=7.352.0",
    "trimesh>=4.6.10",
    "urdf-parser-py>=0.0.4",
    "wandb[media]>=0.20.1",
]

[tool.uv]
default-groups = ["langskill"]

# Blackwell (sm_120) GPUs need the cu128 builds; the default PyPI cu126 wheels have no kernels for them.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
robosuite = { git = "https://github.com/ARISE-Initiative/robosuite", branch = "master" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["robocasa"]

[tool.hatch.build.targets.sdist]
include = ["robocasa/**", "pyproject.toml", "README.md", "LICENSE*"]
